<html>
    <head>
        <meta charset="utf-8">
        <meta id="viewport" name="viewport" content ="width=device-width, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        <link rel="stylesheet" type="text/css" href="styles.css"/>
        <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.13.0/css/all.css"/>
        <link href="https://cdn.jsdelivr.net/npm/quasar@2.1.0/dist/quasar.prod.css" rel="stylesheet" type="text/css"/>
        <link href="https://fonts.googleapis.com/css?family=Roboto:100,300,400,500,700,900|Material+Icons" rel="stylesheet" type="text/css"/>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js" defer></script>
        <script src="https://cdn.jsdelivr.net/npm/quasar@2.19.3/dist/quasar.umd.prod.js" defer></script>
        <script src="app.js" defer></script>
    </head>
    <body>
        <div id="loading-main" class="fullscreen flex flex-center">
            
            <!-- Modern Text Carousel -->
            <div class="q-pa-xl text-center z-top">
                <q-carousel animated infinite :autoplay="true" v-model="slide" transition-next="fade" transition-prev="fade" class="bg-transparent text-white" style="height: 150px;">
                    <q-carousel-slide name="1" class="column no-wrap flex-center">
                        <div class="text-h4 text-glow pulse-effect">{{ CarouselText1 }}</div>
                    </q-carousel-slide>
                    <q-carousel-slide name="2" class="column no-wrap flex-center">
                        <div class="text-h4 text-glow pulse-effect">{{ CarouselText2 }}</div>
                    </q-carousel-slide>
                    <q-carousel-slide name="3" class="column no-wrap flex-center">
                        <div class="text-h4 text-glow pulse-effect">{{ CarouselText3 }}</div>
                    </q-carousel-slide>
                    <q-carousel-slide name="4" class="column no-wrap flex-center">
                        <div class="text-h4 text-glow pulse-effect">{{ CarouselText4 }}</div>
                    </q-carousel-slide>
                </q-carousel>
            </div>

            <!-- Loading Bar -->
            <div class="absolute-bottom q-pa-xl flex flex-center z-top">
                <div class="loadingbar">
                    <div class="text-subtitle1 text-purple-glow q-mb-sm text-center">Loading Server Assets...</div>
                    <div class="loadbar"><div class="thingy"></div></div>
                </div>
            </div>

            <!-- Download Dialog -->
            <q-dialog no-shake v-model="download" position="bottom">
                <q-card class="dark-dialog">
                    <q-card-section>
                        <div class="text-h6 text-purple-glow">{{ DownloadTitle }}</div>
                    </q-card-section>
                    <q-card-section class="q-pt-none text-weight-light">
                        {{ DownloadDesc }}
                    </q-card-section>
                    <q-card-actions align="right">
                        <q-btn flat label="Acknowledge" color="purple-4" v-close-popup></q-btn>
                    </q-card-actions>
                </q-card>
            </q-dialog>

        </div>
    </body>
</html>
